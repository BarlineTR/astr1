# Yerel geliştirme ve tek VPS'e taşıma yığını.
#
# Geliştirmede yalnızca `db` gerekiyor:
#   docker compose -f docker/compose.yaml up -d db
#
# Tam yığını denemek için (tasarım belgesi D4'teki taşıma yolu):
#   docker compose -f docker/compose.yaml --profile tam up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro
      POSTGRES_DB: astro
    # 5433, çünkü geliştirme makinesinde 5432'de başka bir Postgres olabilir ve
    # sessizce yanlış veritabanına bağlanmak, bağlanamamaktan çok daha kötü.
    ports: ["5433:5432"]
    volumes: ["astro-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro"]
      interval: 5s
      retries: 10

  site:
    profiles: ["tam"]
    build:
      context: ..
      dockerfile: docker/site.Dockerfile
    environment:
      DATABASE_URL: postgres://astro:astro@db:5432/astro
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET verilmeli}
      BETTER_AUTH_URL: ${SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy

  gateway:
    profiles: ["tam"]
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    ports: ["8420:8420"]

volumes:
  astro-db:
