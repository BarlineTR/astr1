[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

; Seri port hız ayarı test/çalışma sırasında değiştirilebilir
monitor_speed = 115200

; Harici kütüphane gerekmiyor: TMC2209 (step motor) ve MPU-6050 (I2C)
; kaldırıldı, pinleri enkoderlere verildi. Bkz. include/pins.h
lib_deps =

build_flags =
  -O2
  -std=gnu++17
  -DARDUINO_USB_MODE=1
