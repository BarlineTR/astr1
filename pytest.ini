[pytest]
# ROS Humble'ın launch_testing eklentisi eski pytest hook imzasını kullanıyor
# (pytest_pycollect_makemodule(path, ...)) ve venv'deki güncel pytest ile
# PluginValidationError veriyor. Bu paketin testleri launch_testing kullanmıyor,
# bu yüzden yalnızca o eklentiler kapatılıyor — eskiden testleri çalıştırmak için
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 ile TÜM eklentileri kapatmak gerekiyordu.
addopts = -p no:launch_testing -p no:launch_ros
testpaths =
    ros2_ws/src/astro_ai/test
    ros2_ws/src/astro_audio/test
