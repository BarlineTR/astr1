serial_bridge:
  ros__parameters:
    port: "/dev/ttyCH341USB0"
    baud: 115200
    connect_retry_sec: 2.0
    frame_id_imu: "imu_link"
    ticks_per_rev_left: 2048.0
    ticks_per_rev_right: 2048.0
    wheel_radius_left: 0.06
    wheel_radius_right: 0.06
    head_angle_scale: 1.0  # Polarity fixed: ROS (+Left) -> Arduino (+Left)

rplidar_node:
  ros__parameters:
    channel_type: "serial"
    serial_port: "/dev/astro_lidar"
    serial_baudrate: 115200
    frame_id: "laser_frame"
    inverted: false
    angle_compensate: true
    scan_mode: "Standard"
    scan_frequency: 10.0
    auto_standby: false

scan_filter_node:
  ros__parameters:
    range_min: 0.15
    range_max: 12.0
    filter_nan: true

audio_capture_node:
  ros__parameters:
    device_name: "ReSpeaker"
    device_index: -1
    sample_rate: 16000
    channels: 6
    chunk_size: 1024
    vad_threshold: 0.6

speech_recognition_node:
  ros__parameters:
    model_path: "/opt/vosk/vosk-model-small-tr-0.3"
    language: "tr"
    partial_results: false
    silence_timeout_s: 1.5

tts_node:
  ros__parameters:
    language: "tr"
    rate: 150
    volume: 0.8

/oak:
  ros__parameters:
    camera:
      i_nn_type: "none"
      i_enable_imu: false
    i_pipeline_type: "RGBD"
    rgb:
      i_resolution: "1080P"
      i_fps: 30.0
      i_publish_topic: true
    stereo:
      i_enabled: true
      i_depth_filter_size: 5
      i_lr_check: true

face_detector_node:
  ros__parameters:
    input_topic: "/oak/rgb/image_raw"
    scale_factor: 1.1
    min_neighbors: 5
    min_size: 30

head_tracker_node:
  ros__parameters:
    enabled: true
    doa_offset_deg: 0.0
    doa_invert: true                # true (ReSpeaker Clockwise -> ROS Body CCW ters çevirme)
    max_yaw_deg: 180.0              # tam tur serbest; firmware HEAD_MAX_DEG ile ayni olmali
    min_yaw_deg: -180.0             # tam tur serbest; firmware HEAD_MIN_DEG ile ayni olmali
    deadband_deg: 8.0               # 8° (kafanin tam karsiya gelebilmesi icin daraltildi)
    min_dwell_time_s: 3.5           # 3.5s (odak ve bakış kilitleme süresi)
    idle_return_timeout_s: 30.0     # 30.0s (kullanıcıyı terk etmeden sakin bekleme)
    max_speed_deg_s: 45.0           # 45.0 (hizlandirildi)
    min_rms_threshold: 1600.0       # 1600 (arka plan gürültü bağışıklığı)
    noise_multiplier: 3.0           # 3.0 (adaptif gürültü eşiği)
    head_motion_settle_s: 0.5       # 0.5s (kafa durduktan sonra motor gürültüsünün dinmesini bekle)
    # Konusma enerjisi haritasi: dizi kubbenin tepesinde ACILI durdugu icin tek bir
    # kerteriz guvenilir degil; kafa, surekli konusma enerjisinin biriktigi yone doner.
    speech_map_bin_width_deg: 30.0   # yon kovasi genisligi (cikis cozunurlugu degil)
    speech_map_half_life_s: 4.0      # eski konusmacinin sonme yari omru
    speech_map_peak_dominance: 1.6   # tepe, rakibini bu kat gecmezse karar verilmez
    speech_map_min_energy: 4000.0    # bu esigin altinda harita kafayi oynatmaz
    speech_gate_min_duration_s: 0.15 # kapi carpmasini eleyen sure esigi
    speech_gate_collapse_ratio: 8.0  # zirveden bu kat asagi cokerse darbe sayilir
    # Montaj kaymasini olcmek icin: kafa merkezdeyken onune gecip konusun, log'un
    # onerdigi degeri yukaridaki doa_offset_deg'e yazin. Normal kullanimda kapali.
    doa_calibration_enabled: false
    # OAK-D Lite vision fusion — face tracking overrides DOA when camera sees a face
    vision_fusion_enabled: true
    vision_gain: 0.85               # 0.85 (daha seri takip)
    vision_max_correction_deg: 36.0 # kamera yari-FOV: tek bir yuz tespitinin surebilecegi azami aci
    vision_timeout_s: 3.0           # 3.0s (yüzü odakta tutma süresi)


