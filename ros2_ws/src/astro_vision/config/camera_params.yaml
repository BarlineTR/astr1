/oak:
  ros__parameters:
    camera:
      i_nn_type: "none"
      i_enable_imu: false
      i_pipeline_type: "RGBD"
      i_publish_synced_rect_pair: false
    rgb:
      i_resolution: "720P"
      i_fps: 30.0
      i_publish_topic: true
    left:
      i_resolution: "400P"
      i_fps: 30.0
    right:
      i_resolution: "400P"
      i_fps: 30.0
    stereo:
      i_enabled: true
      i_align_depth: true
      i_subpixel: false
      i_lr_check: false
      i_depth_filter_size: 0

webcam_publisher_node:
  ros__parameters:
    # OAK-D yokken USB kamerayı aynı konuya yayınlar (source:=webcam)
    device: 0
    output_topic: "/oak/rgb/image_raw"
    width: 640
    height: 480
    fps: 30.0

face_detector_node:
  ros__parameters:
    input_topic: "/oak/rgb/image_raw"
    depth_topic: "/oak/stereo/image_raw"
    process_every_n: 3
    match_threshold: 0.45
    stable_frames: 3
    scale_factor: 1.1
    min_neighbors: 5
    min_size: 30
