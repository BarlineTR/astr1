/oak:
  ros__parameters:
    camera:
      i_nn_type: "none"
      i_enable_imu: false
      i_usb_speed: "SUPER_PLUS"
    i_pipeline_type: "RGBD"
    rgb:
      i_resolution: "1080P"
      i_fps: 30.0
      i_publish_topic: true
      i_low_bandwidth: true
      i_low_bandwidth_quality: 70
    stereo:
      i_enabled: true
      i_depth_filter_size: 5
      i_lr_check: true
      i_low_bandwidth: true

webcam_publisher_node:
  ros__parameters:
    # OAK-D yokken USB kamerayı aynı konuya yayınlar (source:=webcam)
    device: 0
    output_topic: "/oak/rgb/image_raw"
    width: 640
    height: 480
    fps: 15.0

face_detector_node:
  ros__parameters:
    input_topic: "/oak/rgb/image_raw"
    # Her kareyi tanımaya gerek yok; 3 = her 3. kare (30 FPS'te ~10 Hz)
    process_every_n: 3
    # SFace kosinüs eşiği: yükseltmek yanlış tanımayı azaltır, tanımayı zorlaştırır
    match_threshold: 0.363
    # İsim yayınlanmadan önce üst üste kaç karede aynı çıkmalı (titremeyi önler)
    stable_frames: 3
    # Aşağıdakiler yalnızca yüz modelleri yoksa (Haar yedeği) kullanılır
    scale_factor: 1.1
    min_neighbors: 5
    min_size: 30
