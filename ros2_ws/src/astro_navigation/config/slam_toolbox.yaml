# ASTRO V1 — slam_toolbox (online async) haritalama ayarları
#
# Robot ölçüleri (astro.urdf.xacro'dan): 0.30 x 0.25 m gövde, tekerlek arası
# 0.26 m, LiDAR base_link'e göre [0.10, 0, 0.11], zeminden 0.17 m yükseklikte.
#
# LiDAR RPLIDAR A1 taklidi: 360°, 720 ışın (0.5°), 0.15-12 m, 10 Hz.
# Aşağıdaki eşikler bu menzile göre seçildi; 12 m'lik bir LiDAR'da
# varsayılan 20 m'lik arama pencereleri boşuna CPU harcar.

slam_toolbox:
  ros__parameters:

    # ── Çerçeveler ve topic'ler ──────────────────────────────────────
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_sim_time: true          # simülasyonda ZORUNLU; gerçek robotta false

    # mapping    : sıfırdan harita çıkar
    # localization: kayıtlı haritada konumlan (map_file_name gerekir)
    mode: mapping

    # ── Harita çözünürlüğü ───────────────────────────────────────────
    # 5 cm: 0.9 m'lik kapı açıklıkları 18 hücre eder, planlayıcı için yeterli.
    resolution: 0.05
    max_laser_range: 12.0       # LiDAR'ın gerçek menzili; fazlası hayalet üretir
    minimum_time_interval: 0.2  # 10 Hz taramada her 2. taramayı işle
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    map_update_interval: 2.0
    enable_interactive_mode: true

    # ── Tarama işleme ────────────────────────────────────────────────
    # Robot yavaş; harita güncellemesi için eşikler küçük tutuldu, yoksa
    # dar koridorda düğüm eklenmeden önce çok yol alınıyor ve odometri kayıyor.
    minimum_travel_distance: 0.2      # m
    minimum_travel_heading: 0.2       # rad (~11°)
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.12
    link_scan_maximum_distance: 3.0

    # ── Döngü kapatma ────────────────────────────────────────────────
    # Dünyada koridor + üç oda var; robot aynı koridora geri döndüğünde
    # döngü kapatma birikmiş odometri hatasını siler.
    do_loop_closing: true
    loop_search_maximum_distance: 6.0
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ── Korelasyon (tarama eşleştirme) ───────────────────────────────
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 6.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ── Tarama eşleştirici ───────────────────────────────────────────
    use_scan_matching: true
    use_scan_barycenter: true
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349     # 0.2°
    coarse_search_angle_offset: 0.349     # 20°
    coarse_angle_resolution: 0.0349       # 2°
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # ── Çözücü ───────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── Kalıcılık ────────────────────────────────────────────────────
    # Poz grafiğini seri hâle getir: haritayı sonra sürdürebilmek için.
    map_start_at_dock: true
    debug_logging: false
    throttle_scans: 1
    stack_size_to_use: 40000000
